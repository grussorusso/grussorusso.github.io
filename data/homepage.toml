[[research]]
title = "Serverless Edge-Cloud"
description = "Architectures, function offloading strategies, and dynamic resource management for Function-as-a-Service across edge-cloud continuum infrastructure."

[[research]]
title = "Runtime Adaptation & Performance"
description = "Self-adaptive software systems, autonomous performance tuning, control theoretical methods, and reinforcement learning for dynamic cloud and edge environments."

[[research]]
title = "AI/ML Systems"
description = "Scheduling, model partitioning, and resource allocation for AI/ML inference workloads, alongside agentic AI workflows for serverless systems."

[[software]]
title = "Serverledge"
description = "A Function-as-a-Service framework designed for Edge-Cloud environments, presented at IEEE PerCom '23. Serverledge relies on a decentralized architecture with no centralized gateways for function invocations, supporting horizontal and vertical function execution offloading. Written in Go."
paper = "https://doi.org/10.1109/PERCOM56429.2023.10099372"
github = "https://github.com/grussorusso/serverledge"

