[profile]
name = "Gabriele Russo Russo"
role = "Assistant Professor · University of Rome Tor Vergata"
statement = "I am an Assistant Professor (RTT) at the Department of Civil Engineering and Computer Science Engineering of the University of Rome Tor Vergata. My research focuses on distributed computing systems with emphasis on performance optimization, runtime self-adaptation, serverless computing in the edge-cloud continuum, and resource management for AI/ML workloads."
